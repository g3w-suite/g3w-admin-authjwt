# Keep the publisher workflow local for PyPI OIDC; release implementation is shared.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  queue: max

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: g3w-suite/.github/.github/actions/plugin-cd@main
        with:
          github-token: ${{ github.token }}
